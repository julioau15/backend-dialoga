      tags:
      - Administrador × Profissional
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Detalhes da solicitação
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    $ref: '#/components/schemas/AprovacaoProfissional'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /aprovacoes-profissionais/{id}/aprovar:
    put:
      summary: Aprovar profissional
      description: 'Requisitos relacionados: RF51-56'
      tags:
      - Administrador × Profissional
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Profissional aprovado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Registro atualizado com sucesso!
                  response:
                    $ref: '#/components/schemas/AprovacaoProfissional'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /aprovacoes-profissionais/{id}/recusar:
    put:
      summary: Recusar profissional
      description: 'Requisitos relacionados: RF52, RF57-60'
      tags:
      - Administrador × Profissional
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Profissional recusado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Registro atualizado com sucesso!
                  response:
                    $ref: '#/components/schemas/AprovacaoProfissional'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /pacientes/me:
    get:
      summary: Consultar próprio perfil de paciente
      description: 'Requisitos relacionados: RF153'
      tags:
      - Pacientes
      responses:
        '200':
          description: Perfil do paciente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    $ref: '#/components/schemas/Paciente'
                required:
                - status
                - status_code
