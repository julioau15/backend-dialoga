openapi: 3.0.3
info:
  title: Dialoga API
  description: 'API REST do backend da plataforma Dialoga (monitoramento terapêutico), cobrindo os perfis
    Paciente, Profissional e Administrador.


    Gerado a partir do modelo lógico `BD-lógico-Dialoga_2026.mwb` e validado contra os 16 documentos de
    Requisitos Funcionais (RF_2026_001 a RF_2026_016). Cada operação referencia os IDs de RF que originaram
    a rota, para rastreabilidade acadêmica.'
    
  version: 1.0.0
  contact:
    name: Dialoga — Projeto Profissional de Software, SENAI Jandira
servers:
- url: https://api.dialoga.com.br/v1
  description: Produção (placeholder — ajustar quando o backend for publicado)
tags:
- name: Autenticação
  description: Login, login social e recuperação de senha (RF085-097).
- name: Administradores
  description: 'Tabela `administrador`: cadastro, listagem e perfil do administrador, incluindo troca de senha (RF01-20, RF135-167).'
- name: Administrador × Profissional
  description: 'Tabela `administrador_profissional`: fila de aprovação de novos profissionais pelo Admin (RF41-64).'
- name: Pacientes
  description: 'Tabela `paciente`: cadastro, perfil, dashboard e relatórios do paciente, incluindo a visão do profissional sobre o paciente (RF098-119, RF135-167, RF066-070, RF189-238, RF299-316).'
- name: Profissionais
  description: 'Tabela `profissional`: cadastro, perfil e dashboard do profissional (RF098-119, RF135-167, RF066-070, RF317-331).'
- name: Vínculos
  description: 'Tabela `vinculo`: solicitação, aceite, recusa e listagem do vínculo paciente-profissional, por ambos os lados (RF172-188, RF299-316, RF317-331).'
- name: Consultas
  description: 'Tabela `consulta`: agendamento de consultas (RF021-040).'
- name: Disponibilidades
  description: 'Tabela `disponibilidade`: horários de disponibilidade cadastrados pelo profissional (RF021-040).'
- name: Registros de Humor
  description: 'Tabela `registro_humor`: formulário diário ''Como você está hoje?'' (RF071-084).'
- name: Anotações
  description: 'Tabela `anotacao`: notas privadas do profissional sobre um paciente (RF221-222, RF310-311).'
- name: Solicitações de Acesso
  description: 'Tabela `solicitacao_acesso`: profissional solicita e paciente autoriza acesso a indicadores por categoria (RF202-207, RF223-227, RF312-313).'
- name: Notificações
  description: 'Tabela `notificacao`: listagem e marcação de leitura de notificações (RF120-134).'
- name: Preferências de Notificação
  description: 'Tabela `preferencia_notificacao`: preferências de notificação por categoria, incluindo ''Desligar todas'' (RF120-134).'
- name: Tarefas
  description: 'Tabela `tarefa`: criação, edição e envio de tarefas/questionários (RF257-298).'
- name: Perguntas
  description: 'Tabela `pergunta`: perguntas que compõem uma tarefa (RF257-298).'
- name: Destinatários de Tarefas
  description: 'Tabela `tarefa_destinatario`: acompanhamento de tarefas por destinatário, visão do profissional (RF257-298).'
- name: Respostas
  description: 'Tabela `resposta`: respostas enviadas pelos pacientes às tarefas (RF257-298).'
- name: Tratamentos
  description: 'Tabela `tratamento`: medicamentos em tratamento (RF332-361).'
- name: Horários de Tratamento
  description: 'Tabela `horario_tratamento`: horários configurados para um tratamento (RF332-361).'
- name: Registros de Dose
  description: 'Tabela `registro_dose`: confirmação de doses tomadas/perdidas (RF332-361).'
- name: Especialidades
  description: 'Tabela `especialidade`: domínio de apoio usado pelo cadastro de Profissional.'
- name: Categorias
  description: 'Tabela `categoria`: domínio de apoio usado por Notificação e Solicitações de Acesso.'
paths:
  /auth/login:
    post:
      summary: Login por e-mail e senha
      description: 'Requisitos relacionados: RF85'
      tags:
      - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    $ref: '#/components/schemas/LoginResponse'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /auth/login/google:
    post:
      summary: Login via Google OAuth
      description: 'Requisitos relacionados: RF86 — TODO: requer coluna de senha opcional no modelo (ver
        observações)'
      tags:
      - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginGoogleRequest'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    $ref: '#/components/schemas/LoginResponse'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /auth/logout:
    post:
      summary: Encerrar sessão
      description: 'Requisitos relacionados: RF20, RF64, RF152, RF213'
      tags:
      - Autenticação
      responses:
        '200':
          description: Sessão encerrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Sessão encerrada
                  response:
                    type: object
                    nullable: true
                    example: {}
                required:
                - status
                - status_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/recuperar-senha/solicitar:
    post:
      summary: Solicitar código de recuperação de senha
      description: 'Requisitos relacionados: RF87, RF88, RF92, RF93'
      tags:
      - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaSolicitarRequest'
      responses:
        '200':
          description: Código enviado por e-mail
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Código enviado por e-mail
                  response:
                    type: object
                    nullable: true
                    example: {}
                required:
                - status
                - status_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /auth/recuperar-senha/validar-codigo:
    post:
      summary: Validar código de recuperação recebido por e-mail
      description: 'Requisitos relacionados: RF89, RF94, RF95'
      tags:
      - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaValidarCodigoRequest'
      responses:
        '200':
          description: Código válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Código válido
                  response:
                    type: object
                    nullable: true
                    example: {}
                required:
                - status
                - status_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /auth/recuperar-senha/redefinir:
    post:
      summary: Redefinir senha após validação do código
      description: 'Requisitos relacionados: RF90, RF96, RF97'
      tags:
      - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarSenhaRedefinirRequest'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Senha redefinida
                  response:
                    type: object
                    nullable: true
                    example: {}
                required:
                - status
                - status_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /pacientes:
    post:
      summary: Cadastrar novo paciente
      description: 'Requisitos relacionados: RF98-106'
      tags:
      - Pacientes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PacienteCadastroRequest'
      responses:
        '201':
          description: Paciente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Registro inserido com sucesso!
                  response:
                    $ref: '#/components/schemas/Paciente'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /profissionais:
    post:
      summary: Cadastrar novo profissional (aguarda aprovação do Admin)
      description: 'Requisitos relacionados: RF107-119'
      tags:
      - Profissionais
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfissionalCadastroRequest'
      responses:
        '201':
          description: Profissional criado, com status_aprovacao=Pendente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Registro inserido com sucesso!
                  response:
                    $ref: '#/components/schemas/Profissional'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /administradores:
    get:
      summary: Listar/buscar administradores
      description: 'Requisitos relacionados: RF01-03'
      tags:
      - Administradores
      parameters:
      - name: busca
        in: query
        required: false
        schema:
          type: string
        description: Busca por nome ou e-mail (RF02)
      responses:
        '200':
          description: Lista de administradores
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    type: array
                    items:
                      $ref: '#/components/schemas/Administrador'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Criar novo administrador
      description: 'Requisitos relacionados: RF05-11'
      tags:
      - Administradores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministradorCriarRequest'
      responses:
        '201':
          description: Administrador criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Registro inserido com sucesso!
                  response:
                    $ref: '#/components/schemas/Administrador'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /administradores/{id}:
    delete:
      summary: Remover administrador
      description: 'Requisitos relacionados: RF12-17'
      tags:
      - Administradores
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Administrador removido
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Registro apagado com sucesso!
                  response:
                    type: object
                    nullable: true
                    example: {}
                required:
                - status
                - status_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /administradores/me:
    get:
      summary: Consultar próprio perfil de administrador
      description: 'Requisitos relacionados: RF135-141'
      tags:
      - Administradores
      responses:
        '200':
          description: Perfil do administrador
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    $ref: '#/components/schemas/Administrador'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Editar próprio perfil de administrador
      description: 'Requisitos relacionados: RF141, RF146-149'
      tags:
      - Administradores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministradorAtualizarRequest'
      responses:
        '200':
          description: Perfil atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Registro atualizado com sucesso!
                  response:
                    $ref: '#/components/schemas/Administrador'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /administradores/me/senha:
    put:
      summary: Alterar senha do administrador autenticado
      description: 'Requisitos relacionados: RF142-145'
      tags:
      - Administradores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Registro atualizado com sucesso!
                  response:
                    type: object
                    nullable: true
                    example: {}
                required:
                - status
                - status_code
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /aprovacoes-profissionais:
    get:
      summary: Listar solicitações de acesso de profissionais
      description: 'Requisitos relacionados: RF41-48'
      tags:
      - Administrador × Profissional
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Pendente
          - Aprovado
          - Recusado
          - Todos
        description: Filtro de status (RF46)
      - name: busca
        in: query
        required: false
        schema:
          type: string
        description: Busca por nome, e-mail ou especialidade (RF45)
      responses:
        '200':
          description: Lista de solicitações
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  status_code:
                    type: integer
                    example: 200
                  response:
                    type: array
                    items:
                      $ref: '#/components/schemas/AprovacaoProfissional'
                required:
                - status
                - status_code
                - response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
