        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        status:
          type: boolean
          example: false
        status_code:
          type: integer
          example: 400
        message:
          type: string
          example: Os dados enviados na requisição não estão corretos.
      required:
      - status
      - status_code
      - message
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
          maxLength: 255
      required:
      - email
      - senha
    LoginGoogleRequest:
      type: object
      properties:
        id_token_google:
          type: string
          description: ID token retornado pelo OAuth do Google (RF86).
      required:
      - id_token_google
    LoginResponse:
      type: object
      properties:
        token_acesso:
          type: string
        tipo_perfil:
          type: string
          enum:
          - paciente
          - profissional
          - administrador
        id_usuario:
          type: integer
          format: int64
    RecuperarSenhaSolicitarRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    RecuperarSenhaValidarCodigoRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          minLength: 4
          maxLength: 4
          description: Código numérico de 4 dígitos (RF88/RF94).
      required:
      - email
      - codigo
    RecuperarSenhaRedefinirRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
        nova_senha:
          type: string
          format: password
          minLength: 6
          maxLength: 255
      required:
      - email
      - codigo
      - nova_senha
    Administrador:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_completo:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 150
        celular:
          type: string
          maxLength: 20
          nullable: true
        foto_avatar:
          type: string
          nullable: true
        papel:
          type: string
          maxLength: 20
          example: Admin
        data_criacao:
          type: string
          format: date-time
    AdministradorCriarRequest:
      type: object
      properties:
        nome_completo:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        senha_provisoria:
          type: string
          description: Enviada por e-mail junto às instruções de acesso (RF07).
      required:
      - nome_completo
      - email
      - senha_provisoria
    AdministradorAtualizarRequest:
      type: object
      properties:
        nome_completo:
          type: string
          maxLength: 150
        celular:
          type: string
          maxLength: 20
    AlterarSenhaRequest:
      type: object
      properties:
        senha_atual:
          type: string
          format: password
        nova_senha:
          type: string
          format: password
          minLength: 6
          maxLength: 255
        confirmar_nova_senha:
          type: string
          format: password
      required:
      - senha_atual
      - nova_senha
      - confirmar_nova_senha
    AprovacaoProfissional:
      type: object
      description: Solicitação de acesso do profissional à plataforma, analisada por um administrador
        (RF41-64).
      properties:
        id:
          type: integer
          format: int64
        profissional:
          $ref: '#/components/schemas/ProfissionalResumo'
        status_aprovacao:
          type: string
          enum:
          - Pendente
          - Aprovado
          - Recusado
        data_decisao:
          type: string
          format: date-time
          nullable: true
        criado_em:
          type: string
          format: date-time
    Paciente:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_completo:
          type: string
          maxLength: 150
        apelido:
          type: string
          maxLength: 80
          nullable: true
        data_nascimento:
          type: string
          format: date
          nullable: true
        celular:
          type: string
          maxLength: 20
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        foto_avatar:
          type: string
          nullable: true
        deseja_iniciar_registros:
          type: boolean
        primeiro_acesso_concluido:
          type: boolean
        status_atividade:
          type: string
          maxLength: 20
          example: Ativo
        criado_em:
          type: string
          format: date-time
          nullable: true
    PacienteResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_completo:
          type: string
        foto_avatar:
          type: string
          nullable: true
        status_atividade:
          type: string
    PacienteCadastroRequest:
      type: object
      properties:
        nome_completo:
          type: string
          minLength: 3
          maxLength: 255
        celular:
          type: string
          pattern: ^[0-9]{11}$
        email:
          type: string
          format: email
          minLength: 10
          maxLength: 255
        senha:
          type: string
          format: password
          minLength: 6
          maxLength: 255
        aceite_termos:
          type: boolean
      required:
      - nome_completo
      - email
      - senha
      - aceite_termos
    PacientePrimeiroAcessoRequest:
      type: object
      description: Formulário de perguntas iniciais (RF168-172).
      properties:
        apelido:
          type: string
          maxLength: 80
        data_nascimento:
          type: string
          format: date
          nullable: true
        deseja_iniciar_registros:
          type: boolean
        possui_profissional_vinculado:
          type: boolean
      required:
      - deseja_iniciar_registros
      - possui_profissional_vinculado
    PacienteAtualizarRequest:
      type: object
      properties:
        nome_completo:
          type: string
        apelido:
          type: string
        celular:
          type: string
    PacienteExternoCriarRequest:
      type: object
      description: Cadastro leve de paciente feito pelo profissional, para paciente sem conta na plataforma
        (RF304). Requer ajuste de modelo — ver observações no topo do documento.
      properties:
        nome_completo:
          type: string
          minLength: 3
          maxLength: 255
      required:
      - nome_completo
    Profissional:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_completo:
          type: string
          maxLength: 150
        celular:
          type: string
          maxLength: 20
          nullable: true
        email:
          type: string
          format: email
        cpf:
          type: string
          maxLength: 11
        crp:
          type: string
          maxLength: 20
        instituicao_clinica:
          type: string
          maxLength: 150
          nullable: true
        especialidades:
          type: array
          items:
            type: string
    ProfissionalResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_completo:
          type: string
        especialidade:
          type: string
          nullable: true
        instituicao_clinica:
          type: string
          nullable: true
    ProfissionalCadastroRequest:
      type: object
      properties:
        nome_completo:
          type: string
          minLength: 3
          maxLength: 255
        celular:
          type: string
          pattern: ^[0-9]{11}$
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 6
          maxLength: 255
        cpf:
          type: string
          pattern: ^[0-9]{11}$
        crp:
          type: string
          minLength: 6
          maxLength: 12
        instituicao_clinica:
          type: string
          nullable: true
      required:
      - nome_completo
      - email
      - senha
      - cpf
      - crp
    ProfissionalAtualizarRequest:
      type: object
      properties:
        nome_completo:
          type: string
        celular:
          type: string
        especialidade_ids:
          type: array
          items:
            type: integer
            format: int64
    ProfissionalExternoCriarRequest:
      type: object
      description: Cadastro leve de profissional feito pelo paciente, para profissional sem conta na plataforma
        (RF321). Requer ajuste de modelo — ver observações no topo do documento.
      properties:
        nome_completo:
          type: string
          minLength: 3
        especialidade:
          type: string
        cpf:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
      required:
      - nome_completo
      - especialidade
    Especialidade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        especialidade:
          type: string
          maxLength: 100
    Vinculo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - Pendente
          - Aceito
          - Recusado
          - Inativo
        origem_cadastro:
          type: string
          description: 'Quem originou o vínculo, ex.: ''Paciente'' ou ''Profissional''.'
          maxLength: 20
        data_solicitacao:
          type: string
          format: date-time
          nullable: true
        data_aceite:
          type: string
          format: date-time
          nullable: true
        data_inicio_acompanhamento:
          type: string
          format: date-time
          nullable: true
        data_fim:
          type: string
          format: date-time
          nullable: true
        paciente:
          $ref: '#/components/schemas/PacienteResumo'
        profissional:
          $ref: '#/components/schemas/ProfissionalResumo'
    VinculoCriarRequest:
      type: object
      description: Solicita vínculo entre paciente e profissional (RF172-176, RF302-305).
      properties:
        paciente_id:
          type: integer
          format: int64
        profissional_id:
          type: integer
          format: int64
      required:
      - paciente_id
      - profissional_id
    Consulta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        criado_por:
          type: string
          enum:
          - Paciente
          - Profissional
          maxLength: 20
        nome_da_conculta:
          type: string
          maxLength: 150
          description: Nome da consulta (mantido o nome de coluna original do modelo).
        especialidade:
          type: string
          maxLength: 100
          nullable: true
        data:
          type: string
          format: date
        hora:
          type: string
          format: time
        status:
          type: string
          maxLength: 20
          example: Agendada
        vinculo_id:
          type: integer
          format: int64
    ConsultaCriarRequest:
      type: object
      properties:
        vinculo_id:
          type: integer
          format: int64
          nullable: true
          description: Opcional quando o paciente ainda não tem profissional vinculado (RF29).
        nome_da_conculta:
          type: string
        nome_profissional:
          type: string
          nullable: true
        especialidade:
          type: string
          nullable: true
        data:
          type: string
          format: date
        hora:
          type: string
          format: time
      required:
      - nome_da_conculta
      - data
      - hora
    Disponibilidade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dias_da_semana:
          type: array
          items:
            type: string
            enum:
            - SEG
            - TER
            - QUA
            - QUI
            - SEX
            - SAB
            - DOM
        hora_inicio:
          type: string
          format: time
        hora_fim:
          type: string
          format: time
        tipo_repeticao:
          type: string
          enum:
          - Sem fim
          - Período específico
          maxLength: 20
        data_inicial:
          type: string
          format: date
          nullable: true
        data_final:
          type: string
          format: date
          nullable: true
    DisponibilidadeCriarRequest:
      type: object
      properties:
        dias_da_semana:
          type: array
          items:
            type: string
        hora_inicio:
          type: string
          format: time
        hora_fim:
          type: string
          format: time
        tipo_repeticao:
          type: string
        data_inicial:
          type: string
          format: date
          nullable: true
        data_final:
          type: string
          format: date
          nullable: true
      required:
      - dias_da_semana
      - hora_inicio
      - hora_fim
      - tipo_repeticao
    RegistroHumor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data:
          type: string
          format: date
        sentimento:
          type: string
          enum:
          - Feliz
          - Triste
          - Ansioso
          - Irritado
          - Calmo
          - Cansado
        energia:
          type: string
          enum:
          - Baixa
          - Média
          - Alta
        humor:
          type: string
          enum:
          - Muito bem
          - Bem
          - Neutro
          - Mal
          - Muito mal
        padrao_pensamentos:
          type: string
          enum:
          - Positivos
          - Negativos
          - Neutros
          - Acelerados
          maxLength: 500
        horas_sono:
          type: number
          format: float
        relato:
          type: string
          nullable: true
        data_criacao:
          type: string
          format: date-time
    RegistroHumorCriarRequest:
      type: object
      description: Registro diário; apenas um por dia por paciente (RF83).
      properties:
        sentimento:
          type: string
        energia:
          type: string
        humor:
          type: string
        padrao_pensamentos:
          type: string
        horas_sono:
          type: number
        relato:
          type: string
          nullable: true
      required:
      - sentimento
      - energia
      - humor
      - padrao_pensamentos
      - horas_sono
    Anotacao:
      type: object
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
          maxLength: 200
        conteudo:
          type: string
          maxLength: 1000
        data_criacao:
          type: string
          format: date-time
        data_edicao:
          type: string
          format: date-time
          nullable: true
        profissional_id:
          type: integer
          format: int64
        paciente_id:
          type: integer
          format: int64
    AnotacaoCriarRequest:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 200
        conteudo:
          type: string
          maxLength: 1000
      required:
      - titulo
      - conteudo
    CategoriaCompartilhada:
      type: object
      properties:
        categoria:
          type: string
          enum:
          - Sentimento
          - Energia
          - Humor
          - Horas de sono
          - Acontecimentos
        autorizado:
          type: boolean
    SolicitacaoAcesso:
      type: object
      description: Solicitação de um profissional para acessar indicadores de um paciente (RF202-207,
        RF223-227, RF312-313).
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - Pendente
          - Aprovado
          - Recusado
        data_solicitacao:
          type: string
          format: date-time
        data_resposta:
          type: string
          format: date-time
          nullable: true
        profissional:
          $ref: '#/components/schemas/ProfissionalResumo'
        paciente:
          $ref: '#/components/schemas/PacienteResumo'
        categorias:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaCompartilhada'
    SolicitacaoAcessoCriarRequest:
      type: object
      properties:
        paciente_id:
          type: integer
          format: int64
      required:
      - paciente_id
    SolicitacaoAcessoAprovarRequest:
      type: object
      description: Categorias de dados que o paciente autoriza compartilhar (RF205).
      properties:
        categorias_autorizadas:
          type: array
          items:
            type: string
            enum:
            - Sentimento
            - Energia
            - Humor
            - Horas de sono
            - Acontecimentos
      required:
      - categorias_autorizadas
    Categoria:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoria:
          type: string
          maxLength: 20
          example: Agenda
        tipo_especifico:
          type: string
          maxLength: 50
          nullable: true
    Notificacao:
      type: object
      properties:
        id:
          type: integer
          format: int64
        titulo_mensagem:
          type: string
          maxLength: 255
        lida:
          type: boolean
        data_criacao:
          type: string
          format: date-time
        referencia_evento:
          type: string
          nullable: true
          description: Identificador do recurso relacionado (agenda, tarefa ou paciente) usado pelo link
            'Ver' (RF123).
        categoria:
          $ref: '#/components/schemas/Categoria'
    PreferenciaNotificacao:
      type: object
      properties:
        id:
          type: integer
          format: int64
        categoria:
          type: string
          maxLength: 30
        tipo_especifico:
          type: string
          maxLength: 50
          nullable: true
        ativo:
          type: boolean
    PreferenciasNotificacaoAtualizarRequest:
      type: object
      properties:
        preferencias:
          type: array
          items:
            type: object
            properties:
              categoria:
                type: string
              tipo_especifico:
                type: string
                nullable: true
              ativo:
                type: boolean
    OpcaoPergunta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        texto:
          type: string
          maxLength: 200
        ordem:
          type: integer
    Pergunta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          enum:
          - Múltipla escolha
          - Escolha única
          - Resposta em parágrafo
          - Escala de emoções
          - Escala numérica
          maxLength: 30
        texto:
          type: string
        imagem:
          type: string
          nullable: true
        obrigatoria:
          type: boolean
        ordem:
          type: integer
        opcoes:
          type: array
          items:
            $ref: '#/components/schemas/OpcaoPergunta'
    PerguntaCriarRequest:
      type: object
      properties:
        tipo:
          type: string
        texto:
          type: string
        imagem:
          type: string
          nullable: true
        obrigatoria:
          type: boolean
        ordem:
          type: integer
        opcoes:
          type: array
          items:
            type: object
            properties:
              texto:
                type: string
              ordem:
                type: integer
      required:
      - tipo
      - texto
      - obrigatoria
      - ordem
    Tarefa:
      type: object
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
          maxLength: 200
        tipo:
          type: string
          maxLength: 20
          description: 'Ex.: ''Formulário'', ''Arquivo'', ''Auto-tarefa'' (RF262, RF289).'
        instrucoes:
          type: string
          nullable: true
        anexo_arquivo:
          type: string
          nullable: true
        is_rascunho:
          type: boolean
        data_criacao:
          type: string
          format: date-time
        data_envio:
          type: string
          format: date-time
          nullable: true
        criador:
          type: object
          description: Exatamente um dos dois é preenchido (autor profissional OU auto-tarefa do paciente).
          properties:
            profissional_id:
              type: integer
              format: int64
              nullable: true
            paciente_id:
              type: integer
              format: int64
              nullable: true
        perguntas:
          type: array
          items:
            $ref: '#/components/schemas/Pergunta'
    TarefaCriarRequest:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 200
        tipo:
          type: string
        instrucoes:
          type: string
          nullable: true
        anexo_arquivo:
          type: string
          nullable: true
        paciente_ids:
          type: array
          items:
            type: integer
            format: int64
          description: Vazio = todos os pacientes vinculados (RF277).
        prazos_por_paciente:
          type: array
          description: Prazo específico por paciente destinatário, opcional (RF278).
          items:
            type: object
            properties:
              paciente_id:
                type: integer
                format: int64
              prazo:
                type: string
                format: date-time
                nullable: true
      required:
      - titulo
    TarefaDestinatario:
      type: object
      description: Vínculo entre uma tarefa e um paciente destinatário, com status individual (RF260-261).
      properties:
        id:
          type: integer
          format: int64
        tarefa:
          $ref: '#/components/schemas/Tarefa'
        paciente:
          $ref: '#/components/schemas/PacienteResumo'
        prazo:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - Pendente
          - Em andamento
          - Concluída
          - Em atraso
        data_conclusao:
          type: string
          format: date-time
          nullable: true
    Resposta:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pergunta_id:
          type: integer
          format: int64
        opcao_pergunta_id:
          type: integer
          format: int64
          nullable: true
        valor:
          type: string
          nullable: true
          description: Usado para texto livre e escalas numéricas.
        data_envio:
          type: string
          format: date-time
    RespostasEnviarRequest:
      type: object
      properties:
        respostas:
          type: array
          items:
            type: object
            properties:
              pergunta_id:
                type: integer
                format: int64
              opcao_pergunta_id:
                type: integer
                format: int64
                nullable: true
              valor:
                type: string
                nullable: true
        enviar_definitivamente:
          type: boolean
          description: false = salvar como rascunho (RF268); true = enviar e bloquear edição (RF270-271).
      required:
      - respostas
      - enviar_definitivamente
    RegistroDose:
      type: object
      properties:
        id:
          type: integer
          format: int64
        data_hora_prevista:
          type: string
          format: date-time
        status:
          type: string
          maxLength: 25
          enum:
          - Pendente
          - Tomada
          - Perdida
        data_hora_confirmacao:
          type: string
          format: date-time
          nullable: true
    HorarioTratamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        horario:
          type: string
          format: time
    Tratamento:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome_medicamento:
          type: string
          maxLength: 150
        dosagem:
          type: string
          maxLength: 150
        frequencia:
          type: string
          maxLength: 100
          nullable: true
        lembrete_ativo:
          type: boolean
          nullable: true
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/HorarioTratamento'
    TratamentoCriarRequest:
      type: object
      properties:
        nome_medicamento:
          type: string
        dosagem:
          type: string
        frequencia:
          type: string
          nullable: true
        lembrete_ativo:
          type: boolean
        horarios:
          type: array
          items:
            type: string
            format: time
      required:
      - nome_medicamento
      - dosagem
    RegistroDoseConfirmarRequest:
      type: object
      properties:
        status:
          type: string
          enum:
          - Tomada
          - Perdida
      required:
      - status
    IndicadorPeriodo:
      type: object
      properties:
        nome:
          type: string
          enum:
          - Energia
          - Sentimento
          - Humor
          - Pensamentos
        valor:
          type: number
          format: float
        escala_maxima:
          type: number
          format: float
        faixa:
          type: string
          enum:
          - Positivo
          - Moderado
          - Atenção
    RelatorioPeriodo:
      type: object
      description: Agregação calculada a partir de registros de humor, tarefas e doses de tratamento no
        período (RF189-238). Não corresponde a uma tabela própria do modelo.
      properties:
        periodo_inicio:
          type: string
          format: date
        periodo_fim:
          type: string
          format: date
        quantidade_registros:
          type: integer
        indicadores:
          type: array
          items:
            $ref: '#/components/schemas/IndicadorPeriodo'
        horas_sono:
          type: object
          properties:
            media:
              type: number
            minimo:
              type: number
            maximo:
              type: number
        aderencia_tratamento:
          type: array
          items:
            type: object
            properties:
              nome_medicamento:
                type: string
              percentual:
                type: number
  responses:
    BadRequest:
      description: Os dados enviados na requisição não estão corretos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: false
            status_code: 400
            message: Os dados enviados na requisição não estão corretos.
    Unauthorized:
      description: Não foi possivel processar requisição. usuário não autorizado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: false
            status_code: 401
            message: Não foi possivel processar requisição. usuário não autorizado.
    NotFound:
      description: Não foi possivel encontrar nenhum registro.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: false
            status_code: 404
            message: Não foi possivel encontrar nenhum registro.
    Conflict:
      description: Não foi possivel processar requisição. usuario ou email já cadastrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: false
            status_code: 409
            message: Não foi possivel processar requisição. usuario ou email já cadastrado.
    UnsupportedMediaType:
      description: Não foi possivel processar a requisição, pois o formato de dados aceito pela API é
        somente JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: false
            status_code: 415
            message: Não foi possivel processar a requisição, pois o formato de dados aceito pela API
              é somente JSON.
    InternalServerError:
      description: Não foi possivel processar a requisição por conta de erro interno na API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            status: false
            status_code: 500
            message: Não foi possivel processar a requisição por conta de erro interno na API.
security:
- bearerAuth: []